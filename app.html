<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link rel="stylesheet" href="assets/fir-app.css"/>
<style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>

<body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen">

<!-- Desktop rail (DESIGN.md: 260px navy, lg+). Rendered by fir-shell.js. -->
<aside class="fir-rail" id="firRail" aria-label="Primary"></aside>

<!-- Fixed top header: keeps the generated mobile chrome. -->
<header class="fir-header fixed top-0 left-0 right-0 z-40 h-16 px-space-md bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] flex items-center justify-between gap-3">
  <div class="flex items-center gap-2 min-w-0">
    <img src="assets/emblem.svg" alt="" class="h-8 w-8 flex-shrink-0"/>
    <div class="flex flex-col min-w-0">
      <span class="font-headline-sm text-headline-sm text-on-surface truncate">FIR Portal</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant truncate" id="firPageTitle">FIR Management System</span>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-shrink-0">
    <div class="flex flex-col items-end min-w-0">
      <span id="firWho" class="font-headline-sm text-headline-sm text-on-surface truncate">—</span>
      <span id="firWhoBadge" class="px-1.5 py-0.5 rounded text-[10px] font-semibold tracking-wider uppercase">—</span>
    </div>
    <button type="button" data-action="logout" aria-label="Sign out" class="w-10 h-10 rounded bg-surface-container text-on-surface flex items-center justify-center hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined text-[20px]">logout</span>
    </button>
  </div>
</header>

<!-- Page container. fir-shell.js renders the active role's page here. -->
<main class="fir-main pt-24 px-margin-mobile pb-24 md:px-gutter lg:pt-24 lg:pb-gutter">
  <div id="firView" class="flex flex-col gap-space-md"></div>
</main>

<!-- Generated Stitch bottom tab bar (mobile only). -->
<nav class="fir-bottomnav fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" id="firBottomNav"></nav>

<!-- Toast layer. fir-ui.js owns its content. -->
<div class="fixed bottom-24 lg:bottom-6 left-1/2 -translate-x-1/2 z-[70] flex items-center gap-2 px-4 py-2.5 rounded shadow-lg text-on-secondary text-label-lg max-w-[calc(100vw-2rem)] opacity-0 translate-y-3 pointer-events-none transition-all duration-200" id="toast"></div>

<!-- =========================================================
     Modal templates
     Opened by the generic data-modal system in fir-shell.js.
     The edit templates are filled by registered fillers, so the
     selected record id comes from the Store, not from the markup.
     ========================================================= -->

            <option>South Division Sub-station</option>

          </select>
          <p data-error-for="apStation" class="hidden font-body-sm text-body-sm text-error"></p>
        </div>
        <div class="space-y-1.5">

          <input id="apPhone" type="text" class="w-full bg-surface-container-lowest text-on-surface font-code-case-id text-code-case-id px-3 py-2 rounded border border-[#CBD5E1] focus:outline-none focus:border-secondary" placeholder="9800010007" data-validate="required|phone"/>
          <p data-error-for="apPhone" class="hidden font-body-sm text-body-sm text-error"></p>
        </div>
        <div class="space-y-1.5">

          <input id="apEmail" type="text" class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md px-3 py-2 rounded border border-[#CBD5E1] focus:outline-none focus:border-secondary" placeholder="officer@police.demo.gov.in" data-validate="email"/>

          <p data-error-for="apUsername" class="hidden font-body-sm text-body-sm text-error"></p>
        </div>

        <button type="submit" class="flex items-center gap-2 h-10 px-4 rounded bg-secondary text-on-secondary font-label-lg text-label-lg shadow-sm">

      </div>
